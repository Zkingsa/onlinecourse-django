<!DOCTYPE html>
<html>
<head>
    <title>Exam Result</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="card">
        <div class="card-body text-center">
            {% if passed %}
                <h1 class="text-success">Congratulations!</h1>
                <p class="lead">You have successfully passed the exam.</p>
            {% else %}
                <h1 class="text-danger">Better luck next time!</h1>
                <p class="lead">You did not pass the exam. Please try again.</p>
            {% endif %}
            
            <h3>Your Score: {{ score }}%</h3>
            <p>Total Questions: {{ total }}</p>
            <p>Correct Answers: {{ correct }}</p>
            
            <a href="/onlinecourse/" class="btn btn-primary mt-3">Back to Course</a>
        </div>
    </div>
</body>
</html>
